name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

      dockerfile:
        required: false
        type: string
        default: Dockerfile

      registry:
        required: true
        type: string
      REGISTRY_USERNAME:
        required: true  
        type: string      
    secrets:

      REGISTRY_PASSWORD:
        required: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--no-deprecation"

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: foo
          password: bar

      - name: Build
        run: |
          docker build \
            -f ${{ inputs.dockerfile }} \
            -t ${{ inputs.image_name }} .

      - name: Push
        run: |
          docker push \
            ${{ inputs.image_name }}