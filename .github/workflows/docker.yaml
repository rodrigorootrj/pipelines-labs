name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

      dockerfile:
        required: false
        type: string
        default: Dockerfile

      registry:
        required: true
        type: string

    secrets:
      REGISTRY_USERNAME:
        required: true

      REGISTRY_PASSWORD:
        required: true

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build
        run: |
          docker build \
            -f ${{ inputs.dockerfile }} \
            -t ${{ inputs.registry }}/${{ inputs.image_name }}:${{ github.sha }} .

      - name: Push
        run: |
          docker push \
            ${{ inputs.registry }}/${{ inputs.image_name }}:${{ github.sha }}